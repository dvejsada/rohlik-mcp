services:
  rohlik-mcp:
    image: georgx22/rohlik-mcp:latest
    container_name: rohlik-mcp
    restart: unless-stopped
    # Settings are read from .env (see .env.example). Shop credentials are
    # NOT configured here — each client sends its own with every request.
    env_file: .env
    # Not published to the host: other containers on the network reach this as
    # http://rohlik-mcp:8000/mcp/ by service name, which keeps the credential
    # headers off localhost. Uncomment `ports` only if you need a client outside
    # Docker, and set ROHLIK_MCP_AUTH_TOKEN if you do.
    expose:
      - "${ROHLIK_MCP_PORT:-8000}"
    # ports:
    #   - "${ROHLIK_MCP_PORT:-8000}:${ROHLIK_MCP_PORT:-8000}"
    networks:
      - rohlik-mcp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,socket; socket.create_connection(('127.0.0.1', int(os.environ.get('ROHLIK_MCP_PORT','8000'))), timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  rohlik-mcp:
    # Attach LibreChat to this network too, then point librechat.yaml at
    # http://rohlik-mcp:8000/mcp/ (see the README). Set `external: true` here
    # instead to join a network LibreChat's own compose file already defines.
    driver: bridge
